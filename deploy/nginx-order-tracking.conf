server {
    listen 8080;
    listen [::]:8080;
    server_name 51.79.159.222;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/v1/events/stream (Server-Sent Events) is a long-lived connection, not a
        # normal request/response — without these, Nginx buffers the stream (delaying every
        # event) and kills the connection after the default 60s read timeout. The app also
        # sends X-Accel-Buffering: no on that response, which covers buffering on its own;
        # proxy_buffering off here is belt-and-suspenders. Harmless for every other route,
        # since it only affects how long Nginx waits for the next chunk, not normal requests.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
