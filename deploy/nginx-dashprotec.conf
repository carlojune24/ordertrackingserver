server {
    server_name dashprotec.duckdns.org;

    client_max_body_size 5m;

    # Backend (Fastify, PM2 process "order-tracking-server") — path passed through
    # unchanged (no trailing slash added after the port), since the app's own routes
    # already include /api/v1/... as part of the path; Nginx must not strip /api here.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # See deploy/nginx-order-tracking.conf for why these are needed — the SSE stream
        # (GET /api/v1/events/stream) is a long-lived connection, not a normal request/response.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Uploaded product images (served directly by the backend via @fastify/static).
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI.
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the SvelteKit frontend, built with adapter-static
    # (fallback: 'index.html', i.e. an SPA build) and served directly by
    # Nginx as static files, no Node process needed for the frontend.
    root /var/www/dashprotec-frontend/build;
    index index.html;

    # Hashed filenames under _app/immutable/ never change content for a given
    # name, so they're safe to cache forever; everything else (index.html,
    # logo.jpg, robots.txt) falls through to normal Nginx defaults.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashprotec.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashprotec.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = dashprotec.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dashprotec.duckdns.org;
    return 404; # managed by Certbot


}